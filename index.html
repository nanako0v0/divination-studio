<title>占卜工作室 | Divination Studio</title>
<style>
:root{--bg:#43302E;--panel:#43302E;--gold:#FFF1B5;--light:#C1DBE8;--text:#FFF1B5;--muted:#C1DBE8;--line:#735B57}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Songti TC","Noto Serif TC","STSong","SimSun",serif;font-weight:300}
header{text-align:center;padding:38px 15px 27px;background:linear-gradient(180deg,#43302E,#43302E);border-bottom:1px solid var(--line)}
.brand{font-weight:300;font-size:11px;letter-spacing:5px;color:var(--gold)}h1{font-family:Georgia,serif;font-size:34px;font-weight:400;letter-spacing:6px;margin:16px 0 8px}header p{font-weight:300;font-size:12px;letter-spacing:2px;color:var(--muted)}
main{max-width:720px;margin:auto;padding:22px 16px 55px}.heading{color:var(--gold);font-size:12px;letter-spacing:3px;margin:28px 0 14px}
.systems{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.system{background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:17px 4px}.system.active{border-color:var(--gold);background:#43302E}.system b{display:block;font-size:25px;margin-bottom:9px;color:var(--light)}.system small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}input,select{width:100%;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--text);font-size:14px}.field{margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toggle{display:flex;align-items:center;gap:8px;margin:12px 0 18px}.toggle input{width:auto;accent-color:var(--gold)}
button{font:inherit;cursor:pointer} input,select{font-family:inherit;font-weight:300}.primary{width:100%;padding:15px;background:linear-gradient(120deg,#FFF1B5,#C1DBE8);border:0;border-radius:9px;color:#43302E;font-weight:bold;letter-spacing:3px}
.panel{margin-top:23px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:13px}.hidden{display:none}.result-title{text-align:center;color:var(--light);letter-spacing:3px;font-weight:400}.summary{text-align:center;color:var(--muted);font-size:11px;line-height:1.8;margin:15px 0 22px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card-wrap{text-align:center;min-width:0}.card{aspect-ratio:2/3;perspective:800px}.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s}.card.flipped .inner{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--gold);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:7px;text-align:center}.back{background:radial-gradient(circle,#43302E,#43302E);color:#FFF1B5}.back span{font-size:36px}.back small{font-size:8px;letter-spacing:2px;margin-top:12px}.front{transform:rotateY(180deg);background:linear-gradient(145deg,#FFF1B5,#C1DBE8);color:#43302E}.front .symbol{font-size:35px;margin-bottom:12px}.front strong{font-size:12px;line-height:1.5}.front small{margin-top:9px;font-size:10px}.front.rev .symbol{transform:rotate(180deg)}.position{font-size:11px;color:var(--gold);margin:9px 0 5px}.meaning{font-size:10px;line-height:1.6;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.secondary{padding:12px 6px;background:#43302E;border:1px solid var(--gold);border-radius:8px;color:var(--light);font-size:12px}.prompt{white-space:pre-wrap;overflow-wrap:anywhere;background:#43302E;padding:13px;border-radius:8px;border:1px solid var(--line);font-size:12px;line-height:1.8;color:#C1DBE8}
.note{text-align:center;color:var(--muted);font-size:11px;line-height:1.9;margin:28px 0}footer{text-align:center;border-top:1px solid var(--line);padding:25px;color:#C1DBE8;font-size:10px;letter-spacing:3px}

/* Warm atmospheric lighting */
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 12% 8%, rgba(193,219,232,.11) 0%, transparent 34%),
    radial-gradient(ellipse at 88% 24%, rgba(255,241,181,.12) 0%, transparent 30%),
    radial-gradient(ellipse at 50% 78%, rgba(91,57,46,.28) 0%, transparent 42%),
    linear-gradient(145deg,#241917 0%,#30211F 48%,#1B1211 100%);
  background-attachment:fixed;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,241,181,.07), transparent 48%),
    radial-gradient(ellipse at 0% 100%, rgba(193,219,232,.055), transparent 42%);
}
header{
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255,241,181,.14), transparent 68%),
    linear-gradient(180deg,rgba(36,25,23,.88),rgba(27,18,17,.52));
  border-bottom:1px solid rgba(255,241,181,.22);
  box-shadow:0 12px 35px rgba(15,8,7,.18);
}
.brand{ text-shadow:0 0 16px rgba(255,241,181,.25); }
h1{ text-shadow:0 3px 22px rgba(255,241,181,.16); }
.system,.panel{
  background:linear-gradient(145deg,rgba(111,81,73,.34),rgba(42,29,27,.52));
  border-color:rgba(193,219,232,.19);
  box-shadow:inset 0 1px 0 rgba(255,241,181,.07),0 9px 24px rgba(15,8,7,.17);
}
.system{
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease,background .22s ease;
}
.system:hover,.system:focus-visible{
  transform:translateY(-2px);
  border-color:rgba(255,241,181,.58);
  box-shadow:0 0 0 1px rgba(255,241,181,.08),0 8px 24px rgba(255,241,181,.10),0 12px 24px rgba(15,8,7,.22);
}
.system.active{
  background:linear-gradient(145deg,rgba(193,219,232,.13),rgba(255,241,181,.09));
  border-color:rgba(255,241,181,.68);
  box-shadow:inset 0 1px 0 rgba(255,241,181,.16),0 0 22px rgba(255,241,181,.12),0 10px 24px rgba(15,8,7,.22);
}
input,select{
  background:linear-gradient(145deg,rgba(35,24,22,.72),rgba(75,52,48,.55));
  border-color:rgba(193,219,232,.24);
  box-shadow:inset 0 2px 7px rgba(10,5,4,.2),0 3px 12px rgba(10,5,4,.10);
  transition:border-color .2s ease,box-shadow .2s ease;
}
input:focus,select:focus{
  outline:none;
  border-color:rgba(193,219,232,.72);
  box-shadow:0 0 0 3px rgba(193,219,232,.10),0 0 18px rgba(193,219,232,.12),inset 0 2px 7px rgba(10,5,4,.18);
}
.primary{
  background:linear-gradient(115deg,#FFF1B5 0%,#E8E0C1 48%,#C1DBE8 100%);
  box-shadow:0 5px 0 rgba(27,18,16,.48),0 9px 22px rgba(255,241,181,.17),inset 0 1px 0 rgba(255,255,255,.65);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
  position:relative;
  overflow:hidden;
}
.primary::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.34) 48%,transparent 76%);
  transform:translateX(-120%);
  transition:transform .65s ease;
}
.primary:hover::after{transform:translateX(120%)}
.primary:hover{
  transform:translateY(-2px);
  filter:brightness(1.035);
  box-shadow:0 7px 0 rgba(27,18,16,.42),0 13px 28px rgba(255,241,181,.23),0 0 18px rgba(193,219,232,.12);
}
.primary:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 rgba(27,18,16,.5),0 4px 12px rgba(255,241,181,.12);
}
.secondary{
  background:linear-gradient(145deg,rgba(91,65,60,.92),rgba(48,33,31,.96));
  border-color:rgba(255,241,181,.48);
  box-shadow:inset 0 1px 0 rgba(255,241,181,.12),0 4px 0 rgba(24,15,14,.48),0 8px 17px rgba(10,5,4,.22),0 0 13px rgba(255,241,181,.055);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.secondary:hover{
  transform:translateY(-2px);
  border-color:rgba(255,241,181,.8);
  box-shadow:inset 0 1px 0 rgba(255,241,181,.18),0 6px 0 rgba(24,15,14,.42),0 12px 22px rgba(10,5,4,.25),0 0 18px rgba(255,241,181,.13);
}
.secondary:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 rgba(24,15,14,.5),0 3px 8px rgba(10,5,4,.2);
}
.back{
  background:radial-gradient(circle at 50% 32%,rgba(193,219,232,.20),transparent 48%),linear-gradient(145deg,#5b403a,#352522);
  box-shadow:inset 0 0 22px rgba(255,241,181,.07),0 8px 20px rgba(10,5,4,.24);
}
.front{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 8px 22px rgba(10,5,4,.22);
}
.prompt{
  background:linear-gradient(145deg,rgba(31,21,20,.72),rgba(72,49,45,.64));
  border-color:rgba(193,219,232,.23);
  box-shadow:inset 0 2px 9px rgba(10,5,4,.2);
}
footer{
  border-color:rgba(255,241,181,.18);
  background:linear-gradient(180deg,transparent,rgba(24,15,14,.16));
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}

@media(max-width:380px){main{padding:16px 11px}.cards{gap:7px}.front .symbol{font-size:26px}.front strong{font-size:10px}}

/* Dedicated reveal/result screen for the manual draw flow */
body.result-page header,body.result-page main>*:not(#result),body.result-page footer{display:none!important}
body.result-page main{max-width:900px;min-height:100vh;padding:22px 16px 48px}
body.result-page #result{display:block!important;margin:0 auto;min-height:calc(100vh - 44px);padding:22px 18px 34px;border-color:rgba(255,241,181,.34);box-shadow:0 18px 55px rgba(8,4,3,.34),0 0 34px rgba(255,241,181,.06)}
.result-back{display:block;margin:0 0 22px auto;min-width:150px}
body.result-page .result-title{font-size:22px;margin:18px 0}
body.result-page .cards{gap:clamp(10px,2.4vw,22px)}
body.result-page .card-wrap{animation:resultCardEnter .55s both}
body.result-page .card-wrap:nth-child(2){animation-delay:.08s}
body.result-page .card-wrap:nth-child(3){animation-delay:.16s}
@keyframes resultCardEnter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){body.result-page main{padding:12px 10px 28px}body.result-page #result{padding:17px 11px 25px;min-height:calc(100vh - 24px)}body.result-page .result-title{font-size:18px}}


/* Warm frosted-glass controls */
.system,.panel{
  position:relative;
  isolation:isolate;
  background:linear-gradient(135deg,rgba(255,241,181,.105),rgba(193,219,232,.055) 42%,rgba(39,26,24,.48));
  border:1px solid rgba(255,241,181,.24);
  -webkit-backdrop-filter:blur(18px) saturate(125%);
  backdrop-filter:blur(18px) saturate(125%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.15),
    inset 0 -1px 0 rgba(193,219,232,.07),
    0 10px 28px rgba(12,7,6,.23),
    0 0 22px rgba(255,241,181,.045);
}
.system::before,.panel::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  z-index:-1;
  background:linear-gradient(125deg,rgba(255,255,255,.075),transparent 34%,rgba(193,219,232,.035) 72%,transparent);
}
.system:hover,.system:focus-visible{
  background:linear-gradient(135deg,rgba(255,241,181,.16),rgba(193,219,232,.09) 48%,rgba(39,26,24,.52));
  border-color:rgba(255,241,181,.48);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 12px 30px rgba(12,7,6,.26),0 0 25px rgba(255,241,181,.10);
}
.system.active{
  background:linear-gradient(135deg,rgba(255,241,181,.19),rgba(193,219,232,.12) 48%,rgba(39,26,24,.48));
  border-color:rgba(255,241,181,.58);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 24px rgba(255,241,181,.045),0 0 26px rgba(193,219,232,.10),0 12px 28px rgba(12,7,6,.24);
}
.primary,.secondary{
  -webkit-backdrop-filter:blur(14px) saturate(135%);
  backdrop-filter:blur(14px) saturate(135%);
  border:1px solid rgba(255,241,181,.38);
}
.primary{
  background:linear-gradient(135deg,rgba(255,241,181,.94),rgba(255,248,220,.82) 48%,rgba(193,219,232,.82));
  color:#43302E;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(67,48,46,.10),0 5px 0 rgba(27,18,16,.42),0 10px 24px rgba(255,241,181,.18),0 0 18px rgba(193,219,232,.08);
}
.primary:hover{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 7px 0 rgba(27,18,16,.38),0 14px 30px rgba(255,241,181,.23),0 0 22px rgba(193,219,232,.14);
}
.secondary{
  background:linear-gradient(135deg,rgba(255,241,181,.13),rgba(193,219,232,.085) 48%,rgba(35,24,22,.48));
  color:#FFF1B5;
  border-color:rgba(255,241,181,.32);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20),inset 0 -1px 0 rgba(193,219,232,.08),0 4px 0 rgba(24,15,14,.42),0 9px 20px rgba(10,5,4,.20),0 0 15px rgba(255,241,181,.055);
}
.secondary:hover{
  background:linear-gradient(135deg,rgba(255,241,181,.20),rgba(193,219,232,.13) 48%,rgba(35,24,22,.42));
  border-color:rgba(255,241,181,.56);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.27),0 6px 0 rgba(24,15,14,.38),0 13px 25px rgba(10,5,4,.23),0 0 20px rgba(255,241,181,.12);
}
input,select,.prompt{
  background:linear-gradient(135deg,rgba(255,241,181,.075),rgba(193,219,232,.045),rgba(30,20,19,.48));
  -webkit-backdrop-filter:blur(14px) saturate(120%);
  backdrop-filter:blur(14px) saturate(120%);
  border-color:rgba(255,241,181,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 2px 8px rgba(10,5,4,.14),0 5px 14px rgba(10,5,4,.10);
}
.back{
  background:linear-gradient(145deg,rgba(193,219,232,.20),rgba(255,241,181,.13),rgba(45,31,29,.68));
  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,241,181,.32);
}
.front{
  border:1px solid rgba(255,241,181,.42);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 10px 25px rgba(10,5,4,.24),0 0 15px rgba(193,219,232,.08);
}


.question-presets{margin:-3px 0 18px}
.preset-label{font-size:11px;letter-spacing:2px;color:var(--muted);margin:0 0 9px}
.preset-categories,.preset-questions{display:flex;flex-wrap:wrap;gap:8px}
.preset-category,.preset-question{border:1px solid rgba(255,241,181,.25);border-radius:999px;color:var(--light);background:linear-gradient(135deg,rgba(193,219,232,.10),rgba(255,241,181,.055),rgba(35,24,22,.34));box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 4px 10px rgba(10,5,4,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s,border-color .2s,box-shadow .2s}
.preset-category{padding:8px 14px;font-size:12px}
.preset-category.active{color:var(--gold);border-color:rgba(255,241,181,.68);background:linear-gradient(135deg,rgba(255,241,181,.19),rgba(193,219,232,.12),rgba(35,24,22,.38));box-shadow:0 0 14px rgba(255,241,181,.10),inset 0 1px 0 rgba(255,255,255,.18)}
.preset-subtitle{margin-top:15px}
.preset-question{padding:8px 12px;font-size:11px;line-height:1.5;text-align:left;border-radius:10px}
.preset-category:hover,.preset-question:hover{border-color:rgba(255,241,181,.62);box-shadow:0 0 14px rgba(193,219,232,.12)}
@media(max-width:520px){.preset-categories,.preset-questions{gap:7px}.preset-category{padding:8px 12px}.preset-question{font-size:11px}}

.history-trigger{display:block;width:100%;margin:14px 0 0;padding:12px 16px;border:1px solid rgba(255,241,181,.34);border-radius:14px;background:linear-gradient(135deg,rgba(193,219,232,.13),rgba(255,241,181,.07),rgba(45,31,29,.38));color:var(--gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 22px rgba(10,5,4,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer}
.history-trigger:hover,.history-tab:hover{border-color:rgba(255,241,181,.7);box-shadow:0 0 18px rgba(193,219,232,.13)}
#historyOpen::before,#historyOpen::after{content:none!important;display:none!important}
#historyOpen{font-size:0}
#historyOpen{font-size:14px}
.history-modal{position:fixed;inset:0;z-index:30;background:rgba(12,8,7,.78);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:18px}
.history-modal.hidden{display:none}
.history-dialog{width:min(720px,100%);max-height:85vh;overflow:auto;background:linear-gradient(145deg,#382725,#241918);border:1px solid rgba(255,241,181,.3);border-radius:20px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.1)}
.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.history-head h2{margin:0;color:var(--gold);font-size:20px}
.history-close{display:grid;place-items:center;flex:0 0 36px;width:36px;height:36px;padding:0;background:rgba(193,219,232,.10);border:1px solid var(--line);border-radius:50%;color:var(--gold);font-family:Arial,sans-serif!important;font-size:24px!important;font-weight:300!important;line-height:1;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}.history-close:hover{background:rgba(193,219,232,.2);border-color:var(--gold);transform:rotate(90deg)}
.history-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.history-tab{background:rgba(193,219,232,.08);border:1px solid var(--line);border-radius:999px;padding:8px 13px;color:var(--light);cursor:pointer}
.history-tab.active{background:rgba(255,241,181,.16);border-color:var(--gold);color:var(--gold)}
.history-copy{color:var(--light);font-size:14px;line-height:1.9}
.history-copy h3{color:var(--gold);font-size:16px;margin:18px 0 6px}
.history-copy p{margin:7px 0}
.history-copy a{color:var(--gold);text-decoration:underline;text-underline-offset:3px}
.history-note{padding:10px 12px;border-left:2px solid var(--gold);background:rgba(255,241,181,.06);border-radius:0 9px 9px 0;margin:14px 0}
@media(max-width:520px){.history-dialog{padding:17px}.history-copy{font-size:13px}}

 background:

 -webkit-backdrop-filter:blur(22px) saturate(145%)!important;
 backdrop-filter:blur(22px) saturate(145%)!important;
}

 background:linear-gradient(145deg,rgba(255,241,181,.12),rgba(193,219,232,.075) 38%,rgba(30,20,19,.58))!important;
 border-color:rgba(255,241,181,.3)!important;

const historyData={
 tarot:`<h3>起源：最初不是占卜牌</h3><p>塔羅牌的可考歷史通常追溯至15世紀的義大利北部。早期塔羅牌是供人遊戲的紙牌，當時常稱為「trionfi」，後來逐漸形成今日熟悉的塔羅牌系統。它最初並不是為了預測命運而設計。</p><h3>從紙牌遊戲到神秘學</h3><p>18世紀末，歐洲部分作者開始將塔羅牌連結到古埃及、神秘知識與占卜。這些說法深刻影響後世塔羅文化，但不少古老起源論並沒有可靠史料支持。19至20世紀的神秘學團體進一步建立象徵系統；1909年出版的 Rider–Waite–Smith 牌組，尤其影響現代常見的圖像與解牌方式。</p><h3>今日的塔羅</h3><p>現代塔羅同時被用於牌卡遊戲、藝術創作、靈性實踐與自我反思。不同牌組和流派可能採用不同象徵，不存在所有人都必須遵循的唯一解法。</p><div class="history-note">歷史提醒：塔羅作為紙牌的15世紀起源，與後來的占卜用途是不同階段，請勿把後世神秘學傳說當成已證實的中世紀史實。</div><p>延伸資料：<a href="https://www.britannica.com/topic/tarot" target="_blank" rel="noopener">Encyclopaedia Britannica：Tarot</a> · <a href="https://www.metmuseum.org/" target="_blank" rel="noopener">The Metropolitan Museum of Art</a></p>`,
 lenormand:`<h3>起源：18世紀末的紙牌遊戲</h3><p>今日常見的雷諾曼牌，與18世紀末德語地區流行的「希望之牌」（Das Spiel der Hoffnung）有關。這類牌最初是一種帶有圖像與遊戲規則的紙牌遊戲，後來才逐漸發展出占卜用途。</p><h3>名稱從何而來？</h3><p>「雷諾曼」之名取自法國著名占卜師 Marie Anne Lenormand（1772–1843）。不過，現今的36張雷諾曼牌並非她本人創作或親自設計；她去世後，出版商借用她的名聲推出相關牌卡，名稱與系統才逐漸固定。</p><h3>現代雷諾曼的特色</h3><p>雷諾曼通常以36張牌構成，解讀重視牌與牌之間的組合、相鄰關係與句子式閱讀。不同於塔羅常見的單張象徵延伸，雷諾曼往往需要把多張牌連在一起理解。</p><div class="history-note">歷史提醒：Marie Anne Lenormand 是真實歷史人物，但「現代雷諾曼牌由她發明」並不是可靠的歷史結論。</div><p>延伸資料：<a href="https://www.britannica.com/biography/Marie-Anne-Adelaide-Lenormand" target="_blank" rel="noopener">Encyclopaedia Britannica：Marie-Anne Lenormand</a> · <a href="https://www.worldcat.org/" target="_blank" rel="noopener">WorldCat：歷史牌卡書目檢索</a></p>`,
 runes:`<h3>起源：古日耳曼語族的文字系統</h3><p>符文（runic letters）首先是日耳曼語族使用的文字系統，刻寫於石碑、金屬、木材、骨器與日常物件。最早的盧恩銘文大約出現在公元2世紀前後。最常被現代占卜使用的古弗薩克（Elder Futhark）共有24個字母，名稱來自前六個符文的排列。</p><h3>歷史上的演變</h3><p>符文並非單一時代固定不變的符號。古弗薩克之後，北歐地區發展出較晚的 Younger Futhark（年輕弗薩克，常見於維京時代），英格蘭與弗里西亞地區也有 Anglo-Saxon Futhorc 等不同系統。不同時期的符文數量、字形與語言用途並不相同。</p><h3>符文與占卜</h3><p>古代文獻確實記錄過日耳曼人使用刻有記號的籤片等習俗，但這不等於今日網路常見的24枚符文占卜關鍵字，已被證明是古代固定傳承。現代符文占卜的許多對應意義，是近現代靈性與神秘學傳統整理、發展出的詮釋。</p><div class="history-note">歷史提醒：符文作為文字有大量銘文證據；但現代「每枚符文對應一種占卜牌義」的系統，不能直接視為已由古代史料證實。</div><p>延伸資料：<a href="https://www.britannica.com/topic/runic-alphabet" target="_blank" rel="noopener">Encyclopaedia Britannica：Runic alphabet</a> · <a href="https://en.wikipedia.org/wiki/Elder_Futhark" target="_blank" rel="noopener">Elder Futhark（入門索引）</a></p>`
};

function preloadDeckImages(systemName){
 const urls=deckImageUrls(systemName);
 if(!urls.length||deckImagePreloadCache.has(systemName))return;
 const state={loaded:0,total:urls.length,failed:0};
 deckImagePreloadCache.set(systemName,state);
 let next=0,active=0;
 const pump=()=>{
  while(active<4&&next<urls.length){
   const img=new Image(),url=urls[next++];
   active++;img.decoding="async";
   img.onload=()=>{state.loaded++;active--;pump();};
   img.onerror=()=>{state.failed++;active--;pump();};
   img.src=url;
  }
 };
 pump();
}

  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  canvas.style.width=w+"px";canvas.style.height=h+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const count=Math.min(78,Math.max(38,Math.round(w*h/15500)));
  particles=Array.from({length:count},()=>({
   x:rand(0,w),y:rand(0,h),ox:0,oy:0,
   vx:rand(-.10,.10),vy:rand(-.085,.085),
   r:rand(.5,1.35),a:rand(.22,.58),
   phase:rand(0,Math.PI*2),speed:rand(.12,.42),
   sparkle:Math.random()<.08
  }));
  particles.forEach(p=>{p.ox=p.x;p.oy=p.y});
 }
 function point(e){
  pointer.x=e.clientX;pointer.y=e.clientY;
  pointer.active=true;pointer.until=performance.now()+850;
 }
 window.addEventListener("pointermove",point,{passive:true});
 window.addEventListener("pointerdown",point,{passive:true});
 window.addEventListener("touchmove",function(e){if(e.touches&&e.touches[0])point(e.touches[0])},{passive:true});
 window.addEventListener("pointerup",()=>{pointer.until=performance.now()+450},{passive:true});
 window.addEventListener("resize",resize,{passive:true});
 function draw(t){
  if(document.hidden){raf=0;return}
  const dt=Math.min(2,(t-last)/16.67||1);last=t;
  ctx.clearRect(0,0,w,h);
  if(t>pointer.until)pointer.active=false;
  for(const p of particles){
   p.phase+=.008*p.speed*dt;
   let ax=Math.sin(p.phase*.7)*.008,ay=Math.cos(p.phase*.53)*.007;
   const dx=p.x-pointer.x,dy=p.y-pointer.y,dist=Math.hypot(dx,dy);
   if(pointer.active&&dist<145&&dist>0.01){
    const force=(1-dist/145)*.34;
    ax+=(dx/dist)*force;ay+=(dy/dist)*force;
    p.vx+=(dx/dist)*force*.055;p.vy+=(dy/dist)*force*.04;
   }
   p.vx=(p.vx+ax*dt)*.997;p.vy=(p.vy+ay*dt)*.997;
   p.x+=p.vx*dt;p.y+=p.vy*dt;
   /* Gently return scattered particles toward their resting positions */
   p.vx+=(p.ox-p.x)*.00009*dt;p.vy+=(p.oy-p.y)*.00009*dt;
   if(p.x<-8)p.x=w+8;if(p.x>w+8)p.x=-8;
   if(p.y<-8)p.y=h+8;if(p.y>h+8)p.y=-8;
   const twinkle=.86+.14*Math.sin(p.phase*.8);
   const alpha=Math.max(.08,Math.min(1,p.a*twinkle));
   ctx.beginPath();ctx.fillStyle="rgba(255,252,244,"+alpha+")";
   ctx.shadowColor="rgba(255,255,255,"+(p.sparkle?.95:.58)+")";
   ctx.shadowBlur=p.sparkle?7:3.5;
   ctx.arc(p.x,p.y,p.r*(p.sparkle?1.08:1),0,Math.PI*2);ctx.fill();
   if(p.sparkle){
    ctx.strokeStyle="rgba(255,255,255,"+(alpha*.38)+")";ctx.lineWidth=.55;
    ctx.beginPath();ctx.moveTo(p.x-3.5,p.y);ctx.lineTo(p.x+3.5,p.y);
    ctx.moveTo(p.x,p.y-3.5);ctx.lineTo(p.x,p.y+3.5);ctx.stroke();
   }
  }
  ctx.shadowBlur=0;
  raf=requestAnimationFrame(draw);
 }
 function start(){if(!raf){last=performance.now();raf=requestAnimationFrame(draw)}}
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)start();else if(raf){cancelAnimationFrame(raf);raf=0}});
 resize();
 if(!reduced)start();
 else{
  particles.forEach(p=>{ctx.beginPath();ctx.fillStyle="rgba(255,252,244,"+(p.a*.55)+")";ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});
 }
})();

/* Gentle parallax: light haze drifts slightly as the page scrolls */
(function(){
 let ticking=false;
 window.addEventListener("scroll",function(){
  if(ticking)return;
  ticking=true;
  requestAnimationFrame(function(){
   const shift=-Math.min(window.scrollY*.085,82);
   document.documentElement.style.setProperty("--glass-shift",shift+"px");
   ticking=false;
  });
 },{passive:true});
})();
</script>
