<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#43302E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<title>占卜工作室 | Divination Studio</title>
<style>
:root{--bg:#43302E;--panel:#43302E;--gold:#FFF1B5;--light:#C1DBE8;--text:#FFF1B5;--muted:#C1DBE8;--line:#735B57}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Songti TC","Noto Serif TC","STSong","SimSun",serif;font-weight:300}
header{text-align:center;padding:38px 15px 27px;background:linear-gradient(180deg,#43302E,#43302E);border-bottom:1px solid var(--line)}
.brand{font-weight:300;font-size:11px;letter-spacing:5px;color:var(--gold)}h1{font-family:Georgia,serif;font-size:34px;font-weight:400;letter-spacing:6px;margin:16px 0 8px}header p{font-weight:300;font-size:12px;letter-spacing:2px;color:var(--muted)}
main{max-width:720px;margin:auto;padding:22px 16px 55px}.heading{color:var(--gold);font-size:12px;letter-spacing:3px;margin:28px 0 14px}
.systems{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.system{background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:17px 4px}.system.active{border-color:var(--gold);background:#43302E}.system b{display:block;font-size:25px;margin-bottom:9px;color:var(--light)}.system small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}input,select{width:100%;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--text);font-size:14px}.field{margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toggle{display:flex;align-items:center;gap:8px;margin:12px 0 18px}.toggle input{width:auto;accent-color:var(--gold)}
button{font:inherit;cursor:pointer} input,select{font-family:inherit;font-weight:300}.primary{width:100%;padding:15px;background:linear-gradient(120deg,#FFF1B5,#C1DBE8);border:0;border-radius:9px;color:#43302E;font-weight:bold;letter-spacing:3px}
.panel{margin-top:23px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:13px}.hidden{display:none}.result-title{text-align:center;color:var(--light);letter-spacing:3px;font-weight:400}.summary{text-align:center;color:var(--muted);font-size:11px;line-height:1.8;margin:15px 0 22px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card-wrap{text-align:center;min-width:0}.card{aspect-ratio:2/3;perspective:800px}.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s}.card.flipped .inner{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--gold);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:7px;text-align:center}.back{background:radial-gradient(circle,#43302E,#43302E);color:#FFF1B5}.back span{font-size:36px}.back small{font-size:8px;letter-spacing:2px;margin-top:12px}.front{transform:rotateY(180deg);background:linear-gradient(145deg,#FFF1B5,#C1DBE8);color:#43302E}.front .symbol{font-size:35px;margin-bottom:12px}.front strong{font-size:12px;line-height:1.5}.front small{margin-top:9px;font-size:10px}.front.rev .symbol{transform:rotate(180deg)}.position{font-size:11px;color:var(--gold);margin:9px 0 5px}.meaning{font-size:10px;line-height:1.6;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.secondary{padding:12px 6px;background:#43302E;border:1px solid var(--gold);border-radius:8px;color:var(--light);font-size:12px}.prompt{white-space:pre-wrap;overflow-wrap:anywhere;background:#43302E;padding:13px;border-radius:8px;border:1px solid var(--line);font-size:12px;line-height:1.8;color:#C1DBE8}
.note{text-align:center;color:var(--muted);font-size:11px;line-height:1.9;margin:28px 0}footer{text-align:center;border-top:1px solid var(--line);padding:25px;color:#C1DBE8;font-size:10px;letter-spacing:3px}

/* Warm atmospheric lighting */
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 12% 8%, rgba(193,219,232,.11) 0%, transparent 34%),
    radial-gradient(ellipse at 88% 24%, rgba(255,241,181,.12) 0%, transparent 30%),
    radial-gradient(ellipse at 50% 78%, rgba(91,57,46,.28) 0%, transparent 42%),
    linear-gradient(145deg,#241917 0%,#30211F 48%,#1B1211 100%);
  background-attachment:fixed;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,241,181,.07), transparent 48%),
    radial-gradient(ellipse at 0% 100%, rgba(193,219,232,.055), transparent 42%);
}
header{
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255,241,181,.14), transparent 68%),
    linear-gradient(180deg,rgba(36,25,23,.88),rgba(27,18,17,.52));
  border-bottom:1px solid rgba(255,241,181,.22);
  box-shadow:0 12px 35px rgba(15,8,7,.18);
}
.brand{ text-shadow:0 0 16px rgba(255,241,181,.25); }
h1{ text-shadow:0 3px 22px rgba(255,241,181,.16); }
.system,.panel{
  background:linear-gradient(145deg,rgba(111,81,73,.34),rgba(42,29,27,.52));
  border-color:rgba(193,219,232,.19);
  box-shadow:inset 0 1px 0 rgba(255,241,181,.07),0 9px 24px rgba(15,8,7,.17);
}
.system{
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease,background .22s ease;
}
.system:hover,.system:focus-visible{
  transform:translateY(-2px);
  border-color:rgba(255,241,181,.58);
  box-shadow:0 0 0 1px rgba(255,241,181,.08),0 8px 24px rgba(255,241,181,.10),0 12px 24px rgba(15,8,7,.22);
}
.system.active{
  background:linear-gradient(145deg,rgba(193,219,232,.13),rgba(255,241,181,.09));
  border-color:rgba(255,241,181,.68);
  box-shadow:inset 0 1px 0 rgba(255,241,181,.16),0 0 22px rgba(255,241,181,.12),0 10px 24px rgba(15,8,7,.22);
}
input,select{
  background:linear-gradient(145deg,rgba(35,24,22,.72),rgba(75,52,48,.55));
  border-color:rgba(193,219,232,.24);
  box-shadow:inset 0 2px 7px rgba(10,5,4,.2),0 3px 12px rgba(10,5,4,.10);
  transition:border-color .2s ease,box-shadow .2s ease;
}
input:focus,select:focus{
  outline:none;
  border-color:rgba(193,219,232,.72);
  box-shadow:0 0 0 3px rgba(193,219,232,.10),0 0 18px rgba(193,219,232,.12),inset 0 2px 7px rgba(10,5,4,.18);
}
.primary{
  background:linear-gradient(115deg,#FFF1B5 0%,#E8E0C1 48%,#C1DBE8 100%);
  box-shadow:0 5px 0 rgba(27,18,16,.48),0 9px 22px rgba(255,241,181,.17),inset 0 1px 0 rgba(255,255,255,.65);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
  position:relative;
  overflow:hidden;
}
.primary::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.34) 48%,transparent 76%);
  transform:translateX(-120%);
  transition:transform .65s ease;
}
.primary:hover::after{transform:translateX(120%)}
.primary:hover{
  transform:translateY(-2px);
  filter:brightness(1.035);
  box-shadow:0 7px 0 rgba(27,18,16,.42),0 13px 28px rgba(255,241,181,.23),0 0 18px rgba(193,219,232,.12);
}
.primary:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 rgba(27,18,16,.5),0 4px 12px rgba(255,241,181,.12);
}
.secondary{
  background:linear-gradient(145deg,rgba(91,65,60,.92),rgba(48,33,31,.96));
  border-color:rgba(255,241,181,.48);
  box-shadow:inset 0 1px 0 rgba(255,241,181,.12),0 4px 0 rgba(24,15,14,.48),0 8px 17px rgba(10,5,4,.22),0 0 13px rgba(255,241,181,.055);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.secondary:hover{
  transform:translateY(-2px);
  border-color:rgba(255,241,181,.8);
  box-shadow:inset 0 1px 0 rgba(255,241,181,.18),0 6px 0 rgba(24,15,14,.42),0 12px 22px rgba(10,5,4,.25),0 0 18px rgba(255,241,181,.13);
}
.secondary:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 rgba(24,15,14,.5),0 3px 8px rgba(10,5,4,.2);
}
.back{
  background:radial-gradient(circle at 50% 32%,rgba(193,219,232,.20),transparent 48%),linear-gradient(145deg,#5b403a,#352522);
  box-shadow:inset 0 0 22px rgba(255,241,181,.07),0 8px 20px rgba(10,5,4,.24);
}
.front{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 8px 22px rgba(10,5,4,.22);
}
.prompt{
  background:linear-gradient(145deg,rgba(31,21,20,.72),rgba(72,49,45,.64));
  border-color:rgba(193,219,232,.23);
  box-shadow:inset 0 2px 9px rgba(10,5,4,.2);
}
footer{
  border-color:rgba(255,241,181,.18);
  background:linear-gradient(180deg,transparent,rgba(24,15,14,.16));
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}

@media(max-width:380px){main{padding:16px 11px}.cards{gap:7px}.front .symbol{font-size:26px}.front strong{font-size:10px}}

/* Warm frosted-glass controls */
.system,.panel{
  position:relative;
  isolation:isolate;
  background:linear-gradient(135deg,rgba(255,241,181,.105),rgba(193,219,232,.055) 42%,rgba(39,26,24,.48));
  border:1px solid rgba(255,241,181,.24);
  -webkit-backdrop-filter:blur(18px) saturate(125%);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.15),

    0 10px 28px rgba(12,7,6,.23),
    0 0 22px rgba(255,241,181,.045);
}
.system::before,.panel::before{
  content:"";

  inset:0;

.question-presets{margin:-3px 0 18px}
.preset-label{font-size:11px;letter-spacing:2px;color:var(--muted);margin:0 0 9px}
.preset-categories,.preset-questions{display:flex;flex-wrap:wrap;gap:8px}
.preset-category,.preset-question{border:1px solid rgba(255,241,181,.25);border-radius:999px;color:var(--light);background:linear-gradient(135deg,rgba(193,219,232,.10),rgba(255,241,181,.055),rgba(35,24,22,.34));box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 4px 10px rgba(10,5,4,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s,border-color .2s,box-shadow .2s}

<body>
<header><div class="brand">THE ART OF DIVINATION</div><h1>占卜工作室</h1><p>探索象徵 · 解讀未知 · 傾聽內在</p><div class="language-bar"><label for="siteLanguage">語言 / LANGUAGE</label><select id="siteLanguage" aria-label="選擇網站語言"><option value="zh-TW">繁體中文</option><option value="zh-CN">简体中文</option><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div></header>
<main>
<div id="google_translate_element" aria-hidden="true"></div>
<div class="heading">01 / 選擇占卜系統</div>
<div class="systems">
<button class="system active" data-system="tarot"><b>✧</b>塔羅牌<small>TAROT · 78</small></button>
<button class="system" data-system="lenormand"><b>❖</b>雷諾曼<small>LENORMAND · 36</small></button>
<button class="system" data-system="runes"><b>ᚱ</b>北歐符文<small>RUNES · 24</small></button>
</div>
<div class="heading">02 / 設定你的占卜</div>
<div class="field"><label for="question">占卜問題（選填）</label><input id="question" maxlength="300" placeholder="例如：我與他的關係接下來會如何發展？"></div>
<div class="question-presets">
 <div class="preset-label">選擇問題類型</div>
 <div class="preset-categories" id="presetCategories"></div>
 <div class="preset-label preset-subtitle">選擇一個預設問題，或自行輸入</div>
 <div class="preset-questions" id="presetQuestions"></div>
</div>
<div class="grid"><div class="field"><label for="spread">選擇牌陣</label><select id="spread"></select></div><div class="field"><label for="count">抽取數量</label><select id="count"></select></div></div>
<label class="toggle"><input type="checkbox" id="reversals" checked> 允許出現逆位</label>
<button class="primary" id="draw">✧ 開始占卜 ✧</button>
<section id="result" class="panel hidden">
<h2 class="result-title">✧ 你的占卜結果 ✧</h2><div class="summary" id="summary"></div><div class="cards" id="cards"></div>
<div class="actions"><button class="secondary" id="copy">複製 AI 解牌提示詞</button><button class="secondary" id="redraw">重新抽牌</button></div>
<div class="heading">03 / AI 解牌提示詞</div><div class="prompt" id="prompt"></div>
</section>

<button class="history-trigger" id="historyOpen" type="button">了解歷史與由來</button>

const historyData={
 tarot:`<h3>起源：最初不是占卜牌</h3><p>塔羅牌的可考歷史通常追溯至15世紀的義大利北部。早期塔羅牌是供人遊戲的紙牌，當時常稱為「trionfi」，後來逐漸形成今日熟悉的塔羅牌系統。它最初並不是為了預測命運而設計。</p><h3>從紙牌遊戲到神秘學</h3><p>18世紀末，歐洲部分作者開始將塔羅牌連結到古埃及、神秘知識與占卜。這些說法深刻影響後世塔羅文化，但不少古老起源論並沒有可靠史料支持。19至20世紀的神秘學團體進一步建立象徵系統；1909年出版的 Rider–Waite–Smith 牌組，尤其影響現代常見的圖像與解牌方式。</p><h3>今日的塔羅</h3><p>現代塔羅同時被用於牌卡遊戲、藝術創作、靈性實踐與自我反思。不同牌組和流派可能採用不同象徵，不存在所有人都必須遵循的唯一解法。</p><div class="history-note">歷史提醒：塔羅作為紙牌的15世紀起源，與後來的占卜用途是不同階段，請勿把後世神秘學傳說當成已證實的中世紀史實。</div><p>延伸資料：<a href="https://www.britannica.com/topic/tarot" target="_blank" rel="noopener">Encyclopaedia Britannica：Tarot</a> · <a href="https://www.metmuseum.org/" target="_blank" rel="noopener">The Metropolitan Museum of Art</a></p>`,
 lenormand:`<h3>起源：18世紀末的紙牌遊戲</h3><p>今日常見的雷諾曼牌，與18世紀末德語地區流行的「希望之牌」（Das Spiel der Hoffnung）有關。這類牌最初是一種帶有圖像與遊戲規則的紙牌遊戲，後來才逐漸發展出占卜用途。</p><h3>名稱從何而來？</h3><p>「雷諾曼」之名取自法國著名占卜師 Marie Anne Lenormand（1772–1843）。不過，現今的36張雷諾曼牌並非她本人創作或親自設計；她去世後，出版商借用她的名聲推出相關牌卡，名稱與系統才逐漸固定。</p><h3>現代雷諾曼的特色</h3><p>雷諾曼通常以36張牌構成，解讀重視牌與牌之間的組合、相鄰關係與句子式閱讀。不同於塔羅常見的單張象徵延伸，雷諾曼往往需要把多張牌連在一起理解。</p><div class="history-note">歷史提醒：Marie Anne Lenormand 是真實歷史人物，但「現代雷諾曼牌由她發明」並不是可靠的歷史結論。</div><p>延伸資料：<a href="https://www.britannica.com/biography/Marie-Anne-Adelaide-Lenormand" target="_blank" rel="noopener">Encyclopaedia Britannica：Marie-Anne Lenormand</a> · <a href="https://www.worldcat.org/" target="_blank" rel="noopener">WorldCat：歷史牌卡書目檢索</a></p>`,
 runes:`<h3>起源：古日耳曼語族的文字系統</h3><p>符文（runic letters）首先是日耳曼語族使用的文字系統，刻寫於石碑、金屬、木材、骨器與日常物件。最早的盧恩銘文大約出現在公元2世紀前後。最常被現代占卜使用的古弗薩克（Elder Futhark）共有24個字母，名稱來自前六個符文的排列。</p><h3>歷史上的演變</h3><p>符文並非單一時代固定不變的符號。古弗薩克之後，北歐地區發展出較晚的 Younger Futhark（年輕弗薩克，常見於維京時代），英格蘭與弗里西亞地區也有 Anglo-Saxon Futhorc 等不同系統。不同時期的符文數量、字形與語言用途並不相同。</p><h3>符文與占卜</h3><p>古代文獻確實記錄過日耳曼人使用刻有記號的籤片等習俗，但這不等於今日網路常見的24枚符文占卜關鍵字，已被證明是古代固定傳承。現代符文占卜的許多對應意義，是近現代靈性與神秘學傳統整理、發展出的詮釋。</p><div class="history-note">歷史提醒：符文作為文字有大量銘文證據；但現代「每枚符文對應一種占卜牌義」的系統，不能直接視為已由古代史料證實。</div><p>延伸資料：<a href="https://www.britannica.com/topic/runic-alphabet" target="_blank" rel="noopener">Encyclopaedia Britannica：Runic alphabet</a> · <a href="https://en.wikipedia.org/wiki/Elder_Futhark" target="_blank" rel="noopener">Elder Futhark（入門索引）</a></p>`
};

 let specialist="";
 if(system==="tarot"){
  specialist="【塔羅解讀要求】\n1. 先依牌陣位置逐張解讀，說明牌義如何回應該位置，而非只列關鍵字。\n2. 分析大阿爾克那與小阿爾克那比例、四花色分布、數字或宮廷牌重複等整體訊號。\n3. 若有逆位，說明它可能代表受阻、內化、延遲或失衡等不同可能，不要一律解成相反意思。\n4. 再整合牌與牌之間的呼應、衝突、因果線索與整體故事。\n5. 最後提供主要趨勢、盲點、可執行建議，以及哪些部分仍需現實資訊驗證。";

  specialist="【雷諾曼解讀要求】\n1. 務必以組合閱讀為核心，不要把每張牌拆開後各自下結論。\n2. 先分析相鄰牌對（1+2、2+3，依此類推），說明兩張牌如何互相修飾、限定或改變語意。\n3. 三張／五張線性牌陣請讀出連續句意、中心牌重點及整條牌線的敘事；九宮格請分析中心、十字、對角線與周邊；大牌陣則先分區與主題，再看人物牌、距離、鄰接和重要組合。\n4. 牌義應依問題情境判斷，避免把單一牌（例如蛇、雲、棺材）直接等同某個確定人物或事件。\n5. 最後整理整體訊息、可能發展、需要留意的現實線索與務實建議。";
 }else{
  specialist="【符文解讀要求】\n1. 先辨認符文名稱與符號，依抽取位置解讀其在本次問題中的象徵作用。\n2. 分析符文之間的呼應、張力、順序與整體主題，不要只逐枚列出關鍵字。\n3. 清楚區分可由歷史文字、銘文與語言研究支持的內容，和近現代占卜／靈性傳統賦予的詮釋。\n4. 不要宣稱每枚符文都有唯一、古已有之且已被史料證實的占卜牌義；若歷史證據不足，請明確說明。\n5. 最後提供整體解讀、可能的提醒、可實踐的建議及不確定性。";
 }
 return common+specialist+"\n\n【輸出結構】\n一、整體結論\n二、位置與牌／符文的關係分析\n三、組合與整體脈絡\n四、可能發展與關鍵變數\n五、具體建議\n六、解讀限制與仍待確認之處";
}
function draw(){let n=Number($("count").value),d=shuffle(deck());lastDraw=d.slice(0,n).map((c,i)=>({...c,reversed:system!=="runes"&&$("reversals").checked&&Math.random()<.5,position:(positions[n]||[])[i]||("第"+(i+1)+"張") }));render();}
function render(){
$("cards").innerHTML="";lastDraw.forEach((c,i)=>{let w=document.createElement("div");w.className="card-wrap";let card=document.createElement("div");card.className="card";let inner=document.createElement("div");inner.className="inner";let back=document.createElement("div");back.className="back";back.innerHTML="<span>✧</span><small>DIVINATION</small>";let front=document.createElement("div");front.className="front"+(c.reversed?" rev":"");let sym=document.createElement("div");sym.className="symbol";sym.textContent=c.symbol;let name=document.createElement("strong");name.textContent=c.name;let orient=document.createElement("small");orient.textContent=system==="runes"?"符文":(c.reversed?"逆位":"正位");front.append(sym,name,orient);inner.append(back,front);card.append(inner);let pos=document.createElement("div");pos.className="position";pos.textContent=c.position;let meaning=document.createElement("div");meaning.className="meaning";meaning.textContent=c.meaning;w.append(card,pos,meaning);$("cards").append(w);setTimeout(()=>card.classList.add("flipped"),200+i*180);});
$("summary").textContent=$("spread").selectedOptions[0].textContent+" · "+new Date().toLocaleString("zh-TW");$("prompt").textContent=makePrompt();$("result").classList.remove("hidden");$("result").scrollIntoView({behavior:"smooth",block:"start"});
}
$("draw").addEventListener("click",draw);$("redraw").addEventListener("click",draw);
$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("prompt").textContent);$("copy").textContent="已複製！";}catch(e){let r=document.createElement("textarea");r.value=$("prompt").textContent;document.body.append(r);r.select();document.execCommand("copy");r.remove();$("copy").textContent="已複製！";}setTimeout(()=>$("copy").textContent="複製 AI 解牌提示詞",1800);});
renderPresetQuestions("感情");
setup();

function googleTranslateElementInit(){
 if(window.google&&google.translate){
  new google.translate.TranslateElement({pageLanguage:"zh-TW",includedLanguages:"zh-CN,en,ja,ko",autoDisplay:false}, "google_translate_element");
 }
}
function setSiteLanguage(language){
 const combo=document.querySelector(".goog-te-combo");
 document.documentElement.lang=language;
 if(language==="zh-TW"){
  document.cookie="googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
  document.cookie="googtrans=/zh-TW/zh-TW;path=/";
  location.reload();
  return;
 }
 const target=language==="zh-CN"?"zh-CN":language==="ja"?"ja":language==="ko"?"ko":"en";
 if(combo){combo.value=target;combo.dispatchEvent(new Event("change"));}
 else{
  const wait=setInterval(()=>{const c=document.querySelector(".goog-te-combo");if(c){clearInterval(wait);c.value=target;c.dispatchEvent(new Event("change"));}},250);
  setTimeout(()=>clearInterval(wait),10000);
 }
}
$("siteLanguage").addEventListener("change",e=>setSiteLanguage(e.target.value));

 const script=document.createElement("script");
 script.src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
 script.async=true;
 document.head.appendChild(script);
})();
